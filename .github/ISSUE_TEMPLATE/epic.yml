name: Epic
description: Phase ゴールを実現する Feature 群の追跡
title: "[Epic] "
labels: ["epic", "status:planned"]
body:
  - type: markdown
    attributes:
      value: |
        > 通常は `/aidd-new-phase` で WIP Epic を作成し、`/aidd-new-epic` で詳細化します。

  - type: input
    id: epic_context
    attributes:
      label: Epic Context
      description: 承認時点の Epic コンテキストへのパス
      placeholder: "docs/epics/123-context.md"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: Phase ゴールに対して、この Epic が実現する状態
    validations:
      required: true

  - type: textarea
    id: features
    attributes:
      label: Features
      description: |
        子 Issue（Feature）をタスクリスト形式で列挙する。
        フォーマット: `- [ ] #Issue番号 タイトル`
      placeholder: |
        - [ ] #10 ログイン機能
        - [ ] #11 ユーザー登録機能
    validations:
      required: false

  - type: textarea
    id: related_docs
    attributes:
      label: Related Docs
      description: Spec・Business Context・画面仕様などのリポジトリ相対パス
      placeholder: |
        - Spec: `docs/spec/session-monitoring.md`
        - Business Context: `docs/business-context/session-monitoring.md`
        - Screen Spec: `specs/screens/index.md`
    validations:
      required: false

  - type: textarea
    id: done_when
    attributes:
      label: Done When
      value: |
        - [ ] 全 Feature がクローズ済み
        - [ ] 全受け入れ条件が実環境で確認済み
        - [ ] epic-complete レビューが PASS している
    validations:
      required: true
