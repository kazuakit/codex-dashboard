# Generated by /aidd-setup-stack on 2026-08-25.
# Install after cloning with: mise exec -- lefthook install
pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,json,jsonc,css}"
      run: mise exec -- pnpm exec biome check --no-errors-on-unmatched {staged_files}
    markdownlint:
      glob: "*.{md,markdown}"
      run: mise exec -- markdownlint-cli2 {staged_files} "#AGENTS.md"
    taplo:
      glob: "*.toml"
      run: mise exec -- taplo fmt --check {staged_files}
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- actionlint {staged_files}

pre-push:
  commands:
    verify:
      run: mise exec -- pnpm verify

post-commit:
  commands:
    codegraph-reindex:
      run: npx @colbymchenry/codegraph@1.5.0 index || true
      env:
        FORCE_COLOR: "0"
